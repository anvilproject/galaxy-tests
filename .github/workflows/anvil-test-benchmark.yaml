# Experiment: real workflows on multi-GB inputs instead of the tool-test
# suite, so a deployment choice can be judged on jobs that run for minutes
# rather than the seconds the tool tests' fixtures take (in the November 2026
# runs tool execution was 10 to 12 percent of Batch VM time; the rest was
# boot, idle and teardown).
#
# Third of the experiment callers of anvil-deploy-and-test.yaml, next to
# anvil-test-no-batch.yaml and anvil-test-warm-pool.yaml. The deployment
# inputs are the same as theirs, so the three configurations compared with
# the tool tests can be rerun here by passing their settings:
#
#   nightly-style (default):  leave every input at its default
#   no Batch:  k8s-boot ksuderman/galaxy-k8s-boot@no-batch, machine-type
#              n2-standard-32, values-files with mixins/no-batch.yml last,
#              extra-vars galaxy_job_max_cores=24 galaxy_job_max_mem=96
#   warm pool: k8s-boot ksuderman/galaxy-k8s-boot@anvil-test-mixin,
#              values-files 'values/values.yml mixins/anvil-test.yml
#              mixins/testing.yml mixins/anvil-test-ci.yml mixins/debug.yml',
#              disable-postinstall-imports true, batch-pool-settings
#              {"pool_enabled": true, "pool_ttl_seconds": 600, "pool_max_size": 4}
#
# What runs: two layers over the same staged inputs (benchmarks/bootstrap.yml
# imports the histories and workflows from the benchmarking-inputs bucket).
#
#   1. Workflows. The abm experiment file names workload files under
#      benchmarks/workloads/ (one IWC workflow and its inputs each) and a run
#      count; the default is one invocation each of variant calling, RNA-seq
#      and ChIP-seq on 2 GB of reads, launched concurrently. This measures a
#      user's turnaround.
#   2. Tool matrix. benchmarks/tools/*.yml define 108 single-tool jobs (QC,
#      aligners, samtools/picard, variant callers, peak calling, bedtools,
#      deeptools, quantification, and the text utilities on their outputs)
#      that anvil_tool_matrix.py submits as a dependency graph, K replicas at
#      once for each K in `scale`. This measures throughput and how queue
#      wait, VM count and cost grow with concurrent users.
#
# Results are the per-job metrics for both layers plus summaries under
# results/ in the workflow artifact (benchmark-summary.json and
# tool-matrix-summary.json), and the Rainstone cost estimate the reusable
# workflow records for every run. Reports are never committed to main here.
#
# Manual dispatch only; workflow_dispatch allows at most ten inputs, so the
# billing label is fixed to experiment=benchmark-2g.
name: Anvil workflow and tool-matrix benchmark (2 GB inputs)

on:
  workflow_dispatch:
    inputs:
      instance-name:
        description: 'GCE instance name prefix (a timestamp is appended)'
        default: 'anvil-bench-ci'
        required: true
      experiment:
        description: 'Repo-relative abm experiment file naming the workflows and run count. Empty skips the workflows.'
        default: 'benchmarks/experiments/anvil-2g.yml'
        required: false
      scale:
        description: 'Replica counts for the single-tool matrix (benchmarks/tools/): each level runs all 108 tools K times at once, levels in turn. "1,4,16" is the full ladder but 16 can exceed the step timeout on a single node. Empty skips the matrix.'
        default: '1,4'
        required: false
      machine-type:
        description: 'Machine type of the head-node VM (the nightly uses t2d-standard-16; without Batch it runs every job too)'
        default: 't2d-standard-16'
        required: true
      boot-disk-size:
        description: 'Boot disk of the VM. 500GB always: the matrix writes about 25 GB of BAM per replica and without Batch the disk also holds every job working directory.'
        default: '500GB'
        required: true
      k8s-boot:
        description: 'galaxy-k8s-boot source as owner/repo@ref; every values file below must exist on it'
        default: 'galaxyproject/galaxy-k8s-boot@dev'
        required: true
      values-files:
        description: 'Space-separated Helm values files in -f order, repo-relative to galaxy-k8s-boot'
        default: 'values/values.yml mixins/testing.yml mixins/ci-concurrency.yml mixins/debug.yml'
        required: true
      extra-vars:
        description: 'Space-separated KEY=VALUE Ansible variables passed as launch_vm.sh --extra-var (needs a ref with that flag). Empty passes none.'
        default: ''
        required: false
      disable-postinstall-imports:
        description: 'Skip the post-install import profile (required with the warm-pool test image)'
        type: boolean
        default: false
      batch-pool-settings:
        description: 'JSON saved to the AnVIL admin extension''s GCP Batch Settings form before the workflows start, e.g. {"pool_enabled": true, "pool_ttl_seconds": 600, "pool_max_size": 4}. Empty leaves the deployment''s values.'
        default: ''
        required: false

jobs:
  benchmark:
    name: Deploy Galaxy and run the workflow benchmark
    uses: ./.github/workflows/anvil-deploy-and-test.yaml
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    with:
      instance-name: ${{ inputs.instance-name }}
      run-tests: false
      benchmark-experiment: ${{ inputs.experiment }}
      benchmark-scale: ${{ inputs.scale }}
      k8s-boot: ${{ inputs.k8s-boot }}
      machine-type: ${{ inputs.machine-type }}
      boot-disk-size: ${{ inputs.boot-disk-size }}
      values-files: ${{ inputs.values-files }}
      extra-vars: ${{ inputs.extra-vars }}
      disable-postinstall-imports: ${{ inputs.disable-postinstall-imports }}
      batch-pool-settings: ${{ inputs.batch-pool-settings }}
      experiment-label: benchmark-2g
      commit-reports: false
