# Milestone 1/4 of v2_plan.md: deploy Galaxy via galaxy-k8s-boot's `anvil`
# branch (VM + GCP Batch, no GKE/GalaxyKubeMan), run the AnVIL tool-test
# suite, and commit deployment/tool-test reports back to `main`.
#
# Not yet fully wired up (see v2_plan.md §7/§9):
#   - no matrix/parallel-job split — single `galaxy-tool-test` process,
#     scaled via --parallel-tests, to measure whether that alone is enough
#   - no "expected vs. loaded" toolset check yet
name: Anvil Deployment and Tool Tests (dry run)

on:
  # ~1am US Eastern. cron is UTC-only and doesn't shift with daylight
  # saving, so this is ~1am EST (winter) but ~2am EDT (summer, roughly
  # mid-March to early November) - there's no single cron expression that
  # tracks the DST-adjusted local time exactly. Minute offset from :00 is
  # deliberate: GitHub Actions explicitly warns that schedule triggers see
  # more delay right at the top of the hour, since that's when the most
  # repos' cron schedules fire at once (confirmed live - the 6:00 UTC
  # trigger was ~11h late on 2026-08-27 during a GitHub Actions incident,
  # and still hadn't fired by mid-morning UTC on 2026-08-28 with no
  # incident reported at all).
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      instance-name:
        description: 'GCE instance name prefix (a timestamp is appended)'
        default: 'anvil-test-ci'
        required: true
      parallel-tests:
        description: 'galaxy-tool-test --parallel-tests value'
        default: '32'
        required: true
      run-tests:
        description: 'Run the full tool-test suite (false = time the deploy only)'
        type: boolean
        default: true
      test-page-size:
        description: 'galaxy-tool-test --page-size (0 = disabled, run everything)'
        default: '0'
        required: true
      test-page-number:
        description: 'galaxy-tool-test --page-number (only used if test-page-size != 0)'
        default: '0'
        required: true
      tool-list-file:
        description: 'Repo-relative path to a tool-ID list to test (one per line) - takes priority over random-tool-count/test-page-size/number. Defaults to the same pinned list scheduled runs use, so an unmodified manual dispatch tracks the scheduled set; clear it to fall back to random-tool-count instead.'
        default: '.github/scheduled-tool-ids.txt'
        required: false
      random-tool-count:
        description: 'Test a random sample of this many tools instead (0 = disabled; only used if tool-list-file is blank/not found; takes priority over test-page-size/number)'
        default: '0'
        required: true

env:
  GCP_PROJECT: anvil-and-terra-development
  GCP_ZONE: us-east4-c

jobs:
  deploy-and-test:
    name: Deploy Galaxy (anvil) and run tool tests
    runs-on: ubuntu-latest
    # Comfortably under GitHub-hosted runners' 360-minute hard cap, leaving
    # room for the cleanup step to still run after a timeout cancellation.
    timeout-minutes: 330
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout galaxy-tests
        uses: actions/checkout@v4

      # A separate, plain clone of `main` that every report-generation step
      # below operates in directly (via working-directory), rather than the
      # checkout above: this workflow runs from whatever ref it was
      # dispatched against, which won't always be main (e.g. a feature
      # branch mid-review), so committing/pushing from that checkout could
      # drag unrelated branch history into main. This also means the
      # deploy-history/heatmap scripts see main's actual accumulated
      # history to append to, instead of starting from an empty state every
      # run. if: always() so it's ready for the final commit step even if a
      # later step fails.
      - name: Clone main for report generation
        if: always()
        run: |
          rm -rf /tmp/main-clone
          git clone --depth 1 --branch main \
            "https://${GITHUB_ACTOR}:${{ secrets.GIT_TOKEN }}@github.com/${{ github.repository }}.git" \
            /tmp/main-clone

      # Temporarily tracking `dev`, not `anvil`: the quote-escaping fix for
      # launch_vm.sh's generated cloud-init script has landed on `dev` but
      # not yet on `anvil`, and more changes may follow while this is being
      # shaken out. Switch back to `anvil` once the fix is merged there.
      - name: Checkout galaxy-k8s-boot (dev branch)
        uses: actions/checkout@v4
        with:
          repository: galaxyproject/galaxy-k8s-boot
          ref: dev
          path: galaxy-k8s-boot

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/526897014808/locations/global/workloadIdentityPools/galaxy-tests-identity-pool/providers/gxy-tests-provider'
          service_account: 'galaxy-tests-repo-actions-sa@anvil-and-terra-development.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # inputs.* is only populated for workflow_dispatch - a schedule
      # trigger sees an empty inputs context, so every reference below
      # falls back to that input's own declared default (`|| '...'`),
      # keeping a scheduled run identical to an un-overridden manual one.
      - name: Set instance name
        id: instance
        run: echo "name=${{ inputs.instance-name || 'anvil-test-ci' }}-$(date -u +'%y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Generate ephemeral SSH key for the VM
        id: ssh-key
        run: |
          ssh-keygen -t rsa -b 4096 -f "$RUNNER_TEMP/anvil-ci-key" -N "" -C "github-actions"
          {
            echo "public-key=$(cat "$RUNNER_TEMP/anvil-ci-key.pub")"
            echo "private-key-path=$RUNNER_TEMP/anvil-ci-key"
          } >> "$GITHUB_OUTPUT"

      # --ephemeral-only: no persistent disks, matching the old "fresh cluster
      # every run" model. Project/zone/image are all galaxy-k8s-boot's own
      # `anvil`-branch defaults (verified against anvil-and-terra-development
      # directly - see v2_plan.md §4). --git-branch dev is NOT just about
      # which copy of this script we're running (that's the checkout step
      # above) - launch_vm.sh's own GIT_BRANCH default is still "anvil"
      # regardless of which branch's copy of the script executes, so without
      # this flag the VM's ansible-pull would still pull the (unfixed)
      # anvil branch. Drop this flag once dev's fix is merged to anvil.
      #
      # -f values/values.yml -f mixins/testing.yml -f mixins/ci-concurrency.yml
      # -f mixins/debug.yml: passing any -f replaces launch_vm.sh's own
      # default (values/values.yml alone), so all four are needed.
      # mixins/testing.yml sets allow_path_paste: true, needed for
      # --force_path_paste below (see "Run tool tests"). mixins/ci-concurrency.yml
      # raises the gcp_batch runner's workers from Galaxy's default of 4 -
      # originally to 16 (confirmed via `kubectl get configmap galaxy-configs
      # -o jsonpath='{.data.job_conf\.yml}'` that Batch-routed jobs were
      # capped there, not by Batch/quota itself; PR galaxyproject/
      # galaxy-k8s-boot#97), then to 32 on galaxy-k8s-boot's dev branch once
      # a worker-session-level trace (docs/parallelism-data) showed the
      # 16-slot pool actually hitting its cap ~65% of the time, not sitting
      # idle. Keep parallel-tests below in sync with whatever this mixin is
      # currently set to. mixins/debug.yml sets cleanup_jobs: never, so job
      # working directories (outputs, logs, instrumentation files) survive
      # for live inspection instead of being deleted shortly after each job
      # finishes - needed while diagnosing the GCP-Batch job_metrics/NFS-
      # staleness issue (galaxy-k8s-boot#105), where a job's directory
      # vanished between two consecutive `kubectl exec` checks seconds
      # apart. Tradeoff: job directories now accumulate for the VM's whole
      # lifetime instead of being cleaned up as the run progresses, so a
      # run producing unusually large outputs could get closer to the NFS
      # PVC's capacity than before - the VM is ephemeral and torn down at
      # the end of each run regardless, so this doesn't compound run over
      # run, just within one.
      #
      # -m t2d-standard-16: bumped from t2d-standard-8 alongside the above -
      # local k8s-runner-routed ("small job") jobs share this node's own
      # CPUs with Galaxy's service pods (web, job handler, celery x2,
      # rabbitmq, postgres, nginx, tusd, workflow, k8s-monitor), and
      # raising client/gcp_batch concurrency raises local-runner concurrency
      # too (they're fed by the same worker pool) - t2d-standard-8 was
      # already seeing local-runner jobs peak at 7 of 8 vCPUs at only
      # 16-way parallelism (see docs/parallelism-data), so doubling
      # concurrency without doubling the node would likely have made the
      # node itself the new bottleneck instead of gcp_batch.workers.
      - name: Record deploy start time
        id: deploy-start
        run: echo "epoch=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: Launch Galaxy VM
        working-directory: galaxy-k8s-boot
        run: |
          bin/launch_vm.sh \
            --ephemeral-only \
            --git-branch dev \
            -f values/values.yml -f mixins/testing.yml -f mixins/ci-concurrency.yml -f mixins/debug.yml \
            -m t2d-standard-16 \
            -k "${{ steps.ssh-key.outputs.public-key }}" \
            "${{ steps.instance.outputs.name }}"

      - name: Get VM IP address
        id: vm-ip
        run: |
          sleep 10
          IP=$(gcloud compute instances describe "${{ steps.instance.outputs.name }}" \
            --project="$GCP_PROJECT" --zone="$GCP_ZONE" \
            --format='get(networkInterfaces[0].accessConfigs[0].natIP)')
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          echo "Galaxy VM IP: $IP"

      # --strict-host-key-checking=no on every gcloud compute ssh/scp call
      # below: gcloud manages host keys itself (a separate layer in front of
      # raw ssh -o flags - passing -o StrictHostKeyChecking/UserKnownHostsFile
      # via --ssh-flag does NOT override it). Its own documented default is
      # lenient on the FIRST connection to an instance name and strict on
      # every one after - so when the pre-baked VM image regenerates its SSH
      # host keys on first boot (standard practice so VMs cloned from the
      # same snapshot don't all share identical host keys), gcloud caches
      # whatever key this job's first successful connection saw, then
      # rejects every later connection once the real key has rotated. This
      # flag makes gcloud treat every connection as the lenient "first" one,
      # which is fine here: a real key rotation, not a spoofed host, on an
      # ephemeral VM this job deletes at the end regardless.
      - name: Wait for cloud-init to complete
        run: |
          for i in $(seq 1 60); do
            if gcloud compute ssh "${{ steps.instance.outputs.name }}" \
              --project="$GCP_PROJECT" --zone="$GCP_ZONE" \
              --ssh-key-file="${{ steps.ssh-key.outputs.private-key-path }}" \
              --strict-host-key-checking=no \
              --command="cloud-init status --wait" 2>/dev/null; then
              echo "cloud-init completed"
              break
            fi
            echo "Attempt $i/60: cloud-init still running or SSH not ready..."
            sleep 30
          done

      # galaxy-k8s-boot's cloud-init script runs `ansible-pull` in the
      # foreground inside a `bash -c '...'` block with no `set -e` of its own
      # (only launch_vm.sh itself, which runs on this runner, sets that) and
      # that block's last command is an `echo`. So if ansible-pull fails
      # partway through, the block still exits 0 and cloud-init reports
      # "done" regardless - `cloud-init status --wait` is NOT proof the
      # deployment actually succeeded. Always pull the real log so failures
      # are diagnosable instead of a bare "file not found" further down.
      # Kept in the repo (not just a workflow artifact) so per-task deploy
      # timing survives past the artifact's retention window - see
      # anvil_generate_deploy_stages.py, which parses this into the stacked
      # deploy-stage-timing chart. No more tail truncation: that risked
      # cutting off the earliest tasks (and thus corrupting the TASK/timing
      # pairing that script relies on) once this was more than a diagnostic
      # dump - the whole file has been well under a resource concern
      # (tens of KB) in every run seen so far.
      - name: Fetch cloud-init/ansible-pull output
        if: always()
        continue-on-error: true
        run: |
          mkdir -p logs
          gcloud compute ssh "${{ steps.instance.outputs.name }}" \
            --project="$GCP_PROJECT" --zone="$GCP_ZONE" \
            --ssh-key-file="${{ steps.ssh-key.outputs.private-key-path }}" \
            --strict-host-key-checking=no \
            --command="sudo cloud-init status --long; echo '--- cloud-init-output.log ---'; sudo cat /var/log/cloud-init-output.log" \
            > logs/cloud-init-output.log 2>&1 || echo "Could not fetch cloud-init log (see step output)" | tee -a logs/cloud-init-output.log

      - name: Save ansible-pull output under reports/anvil
        if: always()
        continue-on-error: true
        working-directory: /tmp/main-clone
        run: |
          DIR="reports/anvil/deployments/${{ steps.instance.outputs.name }}"
          mkdir -p "$DIR"
          cp "${{ github.workspace }}/logs/cloud-init-output.log" "$DIR/ansible-output.log"

      # Stdlib only (re/json/os) - no pip install needed, so this can run
      # this early, well before "Set up Python" below installs anything.
      - name: Generate deploy-stage timing data
        if: always()
        continue-on-error: true
        working-directory: /tmp/main-clone
        run: python3 "${{ github.workspace }}/.github/scripts/anvil_generate_deploy_stages.py"

      # kubeconfig lives at /home/debian/.kube/config: the anvil branch's
      # ansible role copies /etc/rancher/rke2/rke2.yaml there for VM_USER
      # "debian" (galaxy-k8s-boot/roles/galaxy_k8s_deployment/tasks/rke2_setup.yml).
      # RKE2's kubeconfig defaults its server to localhost; rewrite it to the
      # VM's external IP either way (harmless no-op if a pattern isn't present).
      # Retry a few times: cloud-init "done" (above) doesn't guarantee the
      # ansible-pull deployment actually finished successfully.
      - name: Copy kubeconfig from VM
        run: |
          mkdir -p ~/.kube
          for i in $(seq 1 10); do
            if gcloud compute scp \
              --project="$GCP_PROJECT" --zone="$GCP_ZONE" \
              --ssh-key-file="${{ steps.ssh-key.outputs.private-key-path }}" \
              --strict-host-key-checking=no \
              "debian@${{ steps.instance.outputs.name }}:/home/debian/.kube/config" \
              ~/.kube/config 2>/dev/null; then
              echo "kubeconfig copied"
              break
            fi
            echo "Attempt $i/10: kubeconfig not present yet..."
            sleep 30
          done
          test -s ~/.kube/config || { echo "kubeconfig never appeared - see the cloud-init/ansible-pull log artifact" >&2; exit 1; }
          sed -i "s|https://127.0.0.1:6443|https://${{ steps.vm-ip.outputs.ip }}:6443|" ~/.kube/config
          sed -i "s|https://0.0.0.0:6443|https://${{ steps.vm-ip.outputs.ip }}:6443|" ~/.kube/config

      - name: Wait for Galaxy deployments to roll out
        run: |
          DEPLOYMENTS=$(kubectl get deployments -n galaxy -o jsonpath='{.items[*].metadata.name}')
          if [ -z "$DEPLOYMENTS" ]; then
            echo "No deployments found in the galaxy namespace" >&2
            exit 1
          fi
          echo "Found deployments: $DEPLOYMENTS"
          for d in $DEPLOYMENTS; do
            kubectl rollout status "deployment/$d" -n galaxy --timeout=15m
          done

      # Galaxy is served under /galaxy (roles/galaxy_k8s_deployment/defaults/main.yml
      # galaxy_prefix), not at the VM's root path.
      - name: Wait for Galaxy API to respond
        id: api
        run: |
          URL="http://${{ steps.vm-ip.outputs.ip }}/galaxy/api/version"
          for i in $(seq 1 30); do
            if response=$(curl -sf "$URL"); then
              echo "Galaxy is up: $response"
              exit 0
            fi
            echo "Attempt $i/30: Galaxy not ready yet..."
            sleep 10
          done
          echo "Galaxy API never became responsive" >&2
          exit 1

      # Captured here (before any tool-test traffic exists) specifically to
      # dissect Galaxy's own startup sequence - a one-shot fetch at the end
      # of the job is too late: a first attempt showed the container's log
      # had already rotated past its retention limit under tool-test
      # request volume, losing the entire startup sequence (a ~1h39m gap
      # between the wait-db init container finishing and the earliest
      # surviving galaxy-web line). The continuous capture started below
      # solves this for the rest of the run, but this early one-shot
      # snapshot is what anvil_generate_galaxy_startup_stages.py actually
      # reads (LOG_FILENAMES) - keep producing it even after that exists.
      - name: Fetch Galaxy web handler startup log
        if: always()
        continue-on-error: true
        run: |
          mkdir -p logs
          kubectl logs -n galaxy deployment/galaxy-web --all-containers=true --prefix=true --tail=-1 \
            > logs/galaxy-web-startup.log 2>&1 || echo "Could not fetch galaxy-web startup log (see step output)" | tee -a logs/galaxy-web-startup.log

      # gzip'd like the two continuously-captured logs, for the same
      # repo-size reason - anvil_generate_galaxy_startup_stages.py checks
      # for both this and the legacy uncompressed filename, so older
      # committed runs keep working.
      - name: Save Galaxy web handler startup log under reports/anvil
        if: always()
        continue-on-error: true
        working-directory: /tmp/main-clone
        run: |
          DIR="reports/anvil/deployments/${{ steps.instance.outputs.name }}"
          mkdir -p "$DIR"
          gzip -c "${{ github.workspace }}/logs/galaxy-web-startup.log" > "$DIR/galaxy-web-startup.log.gz"

      # A one-shot `kubectl logs` (as used for the startup snapshot above,
      # and previously for the final galaxy-web.log/galaxy-job.log capture
      # below) only sees whichever pod/container instance exists at the
      # moment it's invoked, and `-f` stops following - silently, no error
      # - the instant that instance restarts or the pod gets rescheduled to
      # a new pod name. A run's test phase spans hours, long enough for
      # either to happen, and losing the window around a restart is exactly
      # what made a prior stall un-diagnosable (galaxy-job.log's final
      # snapshot only covered the run's last ~45 minutes out of ~3 hours).
      # Wrap `-f` in a retry loop instead: each retry re-resolves
      # `deployment/<name>` to whatever pod is current right now, and a
      # small --tail overlap on retries means a restart during the brief
      # gap between attempts loses nothing (at worst a handful of
      # duplicate lines, never a gap). Runs for the rest of the GH Actions
      # job as a background process on the runner itself (not the target
      # cluster) - nothing to explicitly stop, since the runner VM is
      # destroyed at job end regardless of what's still running on it.
      - name: Start continuous Galaxy web/job pod log capture
        if: always()
        continue-on-error: true
        run: |
          mkdir -p logs
          stream_pod_logs() {
            local deployment="$1" outfile="$2" tail="-1"
            while true; do
              kubectl logs -f -n galaxy "deployment/$deployment" --all-containers=true --prefix=true --tail="$tail" \
                >> "$outfile" 2>&1
              tail=20
              sleep 2
            done
          }
          stream_pod_logs galaxy-web logs/galaxy-web.log &
          stream_pod_logs galaxy-job-0 logs/galaxy-job.log &
          disown -a

      # Stdlib only, same as "Generate deploy-stage timing data" above.
      - name: Generate Galaxy startup timing data
        if: always()
        continue-on-error: true
        working-directory: /tmp/main-clone
        run: python3 "${{ github.workspace }}/.github/scripts/anvil_generate_galaxy_startup_stages.py"

      # Unconditional (not gated on inputs.run-tests): deploy health is
      # tracked on every run, deploy-only or not.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install reporting dependencies
        run: python -m pip install matplotlib jinja2 pyyaml

      - name: Record deploy timing
        working-directory: /tmp/main-clone
        run: |
          DURATION=$(( $(date -u +%s) - ${{ steps.deploy-start.outputs.epoch }} ))
          echo "Deploy took ${DURATION}s"
          python "${{ github.workspace }}/.github/scripts/anvil_record_deployment.py" success "$DURATION" \
            "https://github.com/anvilproject/galaxy-tests/actions/runs/${{ github.run_id }}"

      - name: Install galaxy-tool-test and planemo
        if: ${{ inputs.run-tests || github.event_name == 'schedule' }}
        run: python -m pip install "galaxy-tool-util>=23.0" planemo bioblend

      # Two upstream bugs in galaxy-tool-util (confirmed present from 25.1.1
      # through the latest 26.1.1, so not regressions to just pin around).
      # Patch the installed package directly rather than wait on upstream
      # fixes - each assert fails loudly if the expected text isn't found,
      # e.g. once it's actually fixed upstream.
      #
      # 1. remote_to_input()'s non-composite-data branch never forwards
      #    force_path_paste to _get_path_or_location, so --force_path_paste
      #    is silently ignored for ordinary file inputs.
      #
      # 2. test_data_path() does `return response.json()` for status 404 as
      #    well as 200, so a test-data file the server can't resolve comes
      #    back as an error *dict*. _get_path_or_location() feeds that
      #    straight into os.path.exists(), which raises
      #    `TypeError: stat: path should be string, bytes, os.PathLike or
      #    integer, not dict` - and that propagates out as a non-zero exit
      #    for the whole process after results are already written. On the
      #    2026-08-22 run this accounted for 54 of 170 failing tests across
      #    15 tools, and 61% of failures once superseded tool revisions are
      #    excluded. Rather than let a 404 crash the run, treat "no
      #    server-side path" as a miss and fall through to the
      #    test_data_download branch, which fetches the file over the API
      #    and, if the server genuinely doesn't have it, fails with the
      #    actionable `Test input file (<name>) cannot be found.` naming the
      #    file. Note this is a *fallback*, not a replacement:
      #    --force_path_paste still wins whenever the server can resolve a
      #    path, so the fast no-download route is unchanged for the ~90% of
      #    lookups that already work.
      - name: Patch galaxy-tool-util force_path_paste bugs
        if: ${{ inputs.run-tests || github.event_name == 'schedule' }}
        run: |
          cat > /tmp/patch_force_path_paste.py << 'PYEOF'
          import galaxy.tool_util.verify.interactor as m

          path = m.__file__
          with open(path) as f:
              content = f.read()

          old = (
              '            path_or_location = self._get_path_or_location(\n'
              '                fname,\n'
              '                test_data,\n'
              '                tool_id,\n'
              '                tool_version=tool_version,\n'
              '                mode="file" if tool_input["class"].lower() == "file" else "directory",\n'
              '            )'
          )
          new = old.replace(
              "tool_version=tool_version,\n",
              "tool_version=tool_version,\n                force_path_paste=force_path_paste,\n",
              1,
          )
          assert old in content, "Expected force_path_paste bug text not found - has this been fixed upstream?"
          content = content.replace(old, new, 1)

          # Bug 2: a 404 from test_data_path() yields an error dict, not a path.
          old_404 = (
              "        if fname and force_path_paste:\n"
              "            file_name = self.test_data_path(tool_id, fname, tool_version=tool_version)\n"
              "            file_name_exists = os.path.exists(file_name)\n"
          )
          new_404 = (
              "        if fname and force_path_paste:\n"
              "            file_name = self.test_data_path(tool_id, fname, tool_version=tool_version)\n"
              "            # 404 returns the error dict, not a path - treat it as a miss.\n"
              "            if not isinstance(file_name, str):\n"
              "                file_name = None\n"
              "            file_name_exists = file_name is not None and os.path.exists(file_name)\n"
          )
          assert old_404 in content, "Expected test_data_path 404 bug text not found - has this been fixed upstream?"
          content = content.replace(old_404, new_404, 1)

          # ...and without a usable path, fall through to test_data_download
          # instead of building a bogus `file://None` location.
          old_paste = (
              "            if force_path_paste:\n"
              "                if file_name is None:\n"
              "                    file_name = self.test_data_path(tool_id, fname, tool_version=tool_version)\n"
              '                return PathOrLocation(name=fname, location=f"file://{file_name}", path=None)\n'
          )
          new_paste = (
              "            if force_path_paste and isinstance(file_name, str):\n"
              '                return PathOrLocation(name=fname, location=f"file://{file_name}", path=None)\n'
          )
          assert old_paste in content, "Expected force_path_paste fallthrough text not found - has this been fixed upstream?"
          content = content.replace(old_paste, new_paste, 1)

          with open(path, "w") as f:
              f.write(content)
          print(f"Patched {path}")

          # Bug 3: --force_path_paste makes the client hand the *server* a path to
          # open (sent as src=url with a file:// URI, which the server normalises
          # to src=path in services/_fetch_util.py). That is right for a path only
          # the server can see, e.g. /cvmfs/..., but wrong for one this client
          # resolved itself - a --test-data fallback file or a test_data_download
          # temp file. The server has no such path and the fetch fails with
          # "[Errno 2] No such file or directory", reported only inside the data
          # fetch tool's own provided metadata, so it surfaces as an opaque
          # "Job in error state, exit_code: None, stderr: ." Decide per file:
          # if the path exists on this client, upload the bytes; otherwise leave
          # it to the server as before.
          import galaxy.tool_util.client.staging as staging_mod

          staging_path = staging_mod.__file__
          with open(staging_path) as f:
              staging = f.read()

          fetch_old = (
              '                is_path = uri.startswith("file://")\n'
              '                if not is_path or use_path_paste:\n'
              '                    return {"src": "url", "url": uri}\n'
              '                else:\n'
              '                    path = uri[len("file://") :]\n'
              '                    upload_payload["__files"][f"files_{index}|file_data"] = self._attach_file(path)\n'
              '                    return {"src": "files"}\n'
          )
          fetch_new = (
              '                is_path = uri.startswith("file://")\n'
              '                local_path = uri[len("file://") :] if is_path else None\n'
              '                server_side = use_path_paste and not (local_path and os.path.exists(local_path))\n'
              '                if not is_path or server_side:\n'
              '                    return {"src": "url", "url": uri}\n'
              '                else:\n'
              '                    upload_payload["__files"][f"files_{index}|file_data"] = self._attach_file(local_path)\n'
              '                    return {"src": "files"}\n'
          )
          assert fetch_old in staging, "Expected staging fetch _attach_file text not found - fixed upstream?"
          staging = staging.replace(fetch_old, fetch_new, 1)

          legacy_old = (
              '                is_path = uri.startswith("file://")\n'
              '                if not is_path or use_path_paste:\n'
              '                    upload_payload["inputs"][f"files_{index}|url_paste"] = uri\n'
              '                else:\n'
              '                    path = uri[len("file://") :]\n'
              '                    upload_payload["__files"][f"files_{index}|file_data"] = self._attach_file(path)\n'
          )
          legacy_new = (
              '                is_path = uri.startswith("file://")\n'
              '                local_path = uri[len("file://") :] if is_path else None\n'
              '                server_side = use_path_paste and not (local_path and os.path.exists(local_path))\n'
              '                if not is_path or server_side:\n'
              '                    upload_payload["inputs"][f"files_{index}|url_paste"] = uri\n'
              '                else:\n'
              '                    upload_payload["__files"][f"files_{index}|file_data"] = self._attach_file(local_path)\n'
          )
          assert legacy_old in staging, "Expected staging legacy _attach_file text not found - fixed upstream?"
          staging = staging.replace(legacy_old, legacy_new, 1)

          with open(staging_path, "w") as f:
              f.write(staging)
          print(f"Patched {staging_path}")
          PYEOF
          python /tmp/patch_force_path_paste.py

      # galaxypassword is the bootstrap_admin_api_key baked in by
      # galaxy-k8s-boot - per Galaxy's own config docs, it's meant only to
      # "bootstrap Galaxy, in particular to create a real admin user account
      # via API", not as a general-purpose key. Using it directly as -k/-a
      # for galaxy-tool-test failed with a JSON-decode error on the first
      # real API call (run 6) - it authenticates as a virtual
      # BootstrapAdminUser with no real DB user id, which breaks
      # history-backed operations. Mint a real API key for the actual
      # `default-user@galaxyproject.org` user instead - same thing
      # galaxy-helm's own (disabled-by-default) post-install job does for a
      # single_user instance (templates/configmap-post-install.yaml): hit the
      # root URL once to make the web handler auto-create the user record,
      # galaxy-tool-test resolves a test input in three stages: ask the server
      # for a local path (--force_path_paste), else download it from the
      # server's API, else look in whatever --test-data directories it was
      # given. Until now that third stage searched an empty list, so any
      # fixture the deployment could not serve failed outright - 46 tests
      # across 15 tools on the 2026-08-24 run, dominated by Galaxy's built-in
      # tools, whose test-data lives in Galaxy's own tree rather than in the
      # CVMFS toolset the deployment mounts.
      #
      # Two sources are needed because they are complementary, not nested.
      # galaxy's in-repo test-data/ is a trimmed ~3MB set holding the core
      # fixtures (1.bed, simple_line.txt, ...); galaxy-test-data is a separate
      # ~190MB repo holding what was moved out of it (ldInput1.txt,
      # cufflinks_out1.gtf, ...). Of the 22 files those failures ask for, 10
      # are only in the first and 5 only in the second - none in both. Each
      # alone fixes 23 and 1 tests respectively; together, 36.
      #
      # Not cached deliberately: a shallow clone costs seconds against a
      # multi-hour run, and a cache would add a stale-content failure mode for
      # no useful saving.
      #
      # Both clones are non-fatal - losing them costs test coverage, not the
      # run - but the resolved state is echoed into logs/ so a run's results
      # can always be traced back to which sources were actually available.
      - name: Fetch Galaxy test-data for client-side fallback
        if: ${{ inputs.run-tests || github.event_name == 'schedule' }}
        run: |
          mkdir -p logs
          GALAXY_URL="http://${{ steps.vm-ip.outputs.ip }}/galaxy/"

          # Pin to the release the server actually reports, not to the image
          # tag in values.yml - a mixin can override that tag, and this cannot
          # then drift from what is deployed.
          VERSION_MAJOR="$(curl -sf "${GALAXY_URL}api/version" \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('version_major',''))" 2>/dev/null || true)"

          clone_retry() {
            local dest="$1"; shift
            for attempt in 1 2 3; do
              rm -rf "$dest"
              if git clone --quiet "$@" "$dest"; then return 0; fi
              echo "  clone of $dest failed (attempt $attempt/3)"
              sleep 5
            done
            rm -rf "$dest"
            return 1
          }

          if [ -n "$VERSION_MAJOR" ]; then
            echo "Deployed Galaxy reports version_major=$VERSION_MAJOR"
            # Partial + sparse: galaxy's history is far too large to clone for
            # one 3MB directory.
            if clone_retry /tmp/galaxy-src --depth 1 --filter=blob:none --sparse \
                 --branch "release_$VERSION_MAJOR" https://github.com/galaxyproject/galaxy \
               && git -C /tmp/galaxy-src sparse-checkout set test-data; then
              echo "  got galaxy release_$VERSION_MAJOR test-data ($(ls /tmp/galaxy-src/test-data | wc -l) entries)"
            else
              echo "  WARNING: could not fetch galaxy release_$VERSION_MAJOR test-data"
            fi
          else
            echo "WARNING: could not resolve version_major from the API; skipping the galaxy checkout"
          fi

          # No release branches on this one - it tracks master, so there is no
          # version correspondence with the deployed release. Fine for the
          # handful of static fixtures wanted here, but it is a weaker
          # guarantee than the pinned checkout above.
          if clone_retry /tmp/galaxy-test-data --depth 1 \
               https://github.com/galaxyproject/galaxy-test-data; then
            echo "  got galaxy-test-data ($(ls /tmp/galaxy-test-data | wc -l) entries)"
          else
            echo "  WARNING: could not fetch galaxy-test-data"
          fi

          for d in /tmp/galaxy-src/test-data /tmp/galaxy-test-data; do
            [ -d "$d" ] && echo "$d"
          done | tee logs/test-data-sources.txt

      # then fetch/create their API key via bioblend (what `abm galaxy user
      # key` itself calls under the hood).
      - name: Create real API key
        if: ${{ inputs.run-tests || github.event_name == 'schedule' }}
        id: api-key
        run: |
          curl -fsSL "http://${{ steps.vm-ip.outputs.ip }}/galaxy/" > /dev/null
          KEY=$(python -c "
          from bioblend import galaxy
          gi = galaxy.GalaxyInstance(url='http://${{ steps.vm-ip.outputs.ip }}/galaxy/', key='galaxypassword')
          user = gi.users.get_users()[0]
          key = gi.users.get_user_apikey(user['id'])
          if key is None or key == 'Not available.':
              key = gi.users.create_user_apikey(user['id'])
          print(key)
          ")
          echo "::add-mask::$KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      # Five selection modes, in priority order:
      #   1. Scheduled run: always the fixed 200 tool IDs pinned in
      #      .github/scheduled-tool-ids.txt (the exact sample from run
      #      32498376715, the first one confirmed not to silently drop
      #      tools - see the xargs-desync note below), not a fresh random
      #      sample each night. The point of a nightly run right now is to
      #      build confidence in a stable set before widening it, so a
      #      different random 200 each night would defeat that - two
      #      failures a week apart wouldn't tell you whether the tool
      #      regressed or you just got unlucky with the sample. Once
      #      confidence is established, widen coverage by regenerating this
      #      file with more tool IDs (same tests_summary + shuf approach as
      #      mode 3 below) and committing it - not by switching to mode 3,
      #      which would bring back the night-to-night sample churn.
      #   2. tool-list-file non-empty and readable (manual dispatch only):
      #      test the tool IDs listed in that repo-relative file. Defaults
      #      to .github/scheduled-tool-ids.txt itself, so an un-modified
      #      manual dispatch tests the same set the scheduled run does
      #      (useful for re-verifying a fix on demand rather than waiting
      #      for the next 6am UTC trigger) - clear the input to fall
      #      through to mode 3 instead.
      #   3. random-tool-count != 0 (manual dispatch only): sample that many
      #      tool IDs from the server's own tests_summary (the full testable
      #      set, including Galaxy's internal double-underscore utility
      #      tools).
      #   4. test-page-size != 0: existing deterministic pagination through
      #      the full toolset, in whatever order the server returns it.
      #   5. none of the above: -t defaults to ALL_TOOLS, one process tests
      #      everything the "cloud" toolset loaded via CVMFS at startup -
      #      see v2_plan.md §2 step 7. No chunk selection needed either,
      #      per §5.
      #
      # Modes 1, 2 and 3 all end up with a plain list of tool IDs to test
      # individually rather than one single galaxy-tool-test invocation:
      # there's no single-invocation way to hand it a specific list
      # (-t/--tool-id takes exactly one, per
      # galaxy/tool_util/verify/script.py), so this fans one process per
      # tool out across --parallel-tests concurrent workers - a first
      # attempt ran all 200 sequentially (one process at a time, each
      # paying its own auth/history overhead and none of them benefiting
      # from --parallel-tests, since that only parallelizes test cases
      # *within* one process) and blew well past GitHub Actions' 5h30m job
      # timeout before finishing.
      #
      # continue-on-error: ALL_TOOLS (and, incidentally, a random sample
      # drawn from the same tests_summary) always includes those internal
      # utility tools alongside real ones. Those 404 from the server-side
      # test_data_path lookup force_path_paste relies on - another
      # galaxy-tool-util bug: test_data_path() returns response.json()
      # unconditionally on both 200 and 404, so a 404 yields a JSON error
      # dict instead of a path string, crashing os.path.exists() downstream.
      # Individual tests degrade gracefully (recorded as "Errored", not a
      # hard stop), but this crashes the whole process with a non-zero exit
      # right after the results are already written - don't let that abort
      # the report-building step.
      - name: Run tool tests
        if: ${{ inputs.run-tests || github.event_name == 'schedule' }}
        continue-on-error: true
        env:
          # Per-test wall-clock ceiling. 900 to match tools-iuc CI's
          # `test_timeout: 900`; at the previous 600 legitimately slow tools
          # were failed for being slow rather than wrong - repeatmodeler
          # test 0 needs ~930s, and image_learner/tabular_learner also
          # tripped it. Raising this matters more now that the pinned list
          # is on latest tool revisions, which carry ~1.2x more tests.
          GALAXY_TEST_DEFAULT_WAIT: '900'
        run: |
          mkdir -p results logs
          GALAXY_URL="http://${{ steps.vm-ip.outputs.ip }}/galaxy/"

          # Consulted only after the server has already failed to supply a
          # fixture, so adding these cannot change the outcome of any test
          # that currently passes - it is strictly a fallback. Built from
          # whatever the fetch step managed to get, so a failed clone drops
          # coverage rather than breaking the invocation.
          TEST_DATA_ARGS=()
          for d in /tmp/galaxy-src/test-data /tmp/galaxy-test-data; do
            [ -d "$d" ] && TEST_DATA_ARGS+=(--test-data "$d")
          done
          echo "Using ${#TEST_DATA_ARGS[@]} test-data fallback path(s): ${TEST_DATA_ARGS[*]:-none}"
          KEY="${{ steps.api-key.outputs.key }}"
          INSTANCE_NAME="${{ steps.instance.outputs.name }}"
          # inputs.* is empty on a schedule trigger - fall back to each
          # input's own declared default so a scheduled run behaves like
          # an un-overridden manual one (see "Set instance name" above).
          RANDOM_TOOL_COUNT="${{ inputs.random-tool-count || '0' }}"
          PARALLEL_TESTS="${{ inputs.parallel-tests || '32' }}"
          TEST_PAGE_SIZE="${{ inputs.test-page-size || '0' }}"
          TEST_PAGE_NUMBER="${{ inputs.test-page-number || '0' }}"
          TOOL_LIST_FILE="${{ inputs.tool-list-file || '' }}"
          export GALAXY_URL KEY INSTANCE_NAME

          # Report pinned IDs the server doesn't recognise as testable,
          # instead of letting them consume a slot in silence. Six data
          # managers sat in .github/scheduled-tool-ids.txt for months
          # producing no results at all: they were pinned without the
          # `data_manager/` path segment the installed tool ids actually
          # carry, so nothing ever matched them. Advisory only - never fails
          # the run, and never rewrites the list file itself (that's a
          # reviewed commit, not a CI side effect). Shared between modes 1
          # and 2 (see the selection-mode comment above): any pinned-style
          # list, not just the scheduled one, benefits from this check.
          run_pinned_list_preflight() {
            curl -sf -H "x-api-key: $KEY" "${GALAXY_URL}api/tools/tests_summary" \
              | python3 -c "import json, sys; print('\n'.join(json.load(sys.stdin).keys()))" \
              > /tmp/testable_tool_ids.txt || true
            if [ -s /tmp/testable_tool_ids.txt ]; then
              cp /tmp/testable_tool_ids.txt logs/testable-tool-ids.txt
              python3 .github/scripts/anvil_preflight_tool_ids.py \
                /tmp/sampled_tool_ids.txt /tmp/testable_tool_ids.txt \
                .github/excluded-tool-ids.txt \
                | tee logs/pinned-list-preflight.txt || true
            else
              echo "Could not fetch tests_summary; skipping pinned-list pre-flight."
            fi
          }

          # Resolve which tool IDs (if any) to test individually - modes 1,
          # 2 and 3 from the comment above. /tmp/sampled_tool_ids.txt
          # staying absent/empty means none applies, falling through to the
          # ALL_TOOLS/paged single-process path below.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            cp .github/scheduled-tool-ids.txt /tmp/sampled_tool_ids.txt
            echo "Scheduled run: testing the $(wc -l < /tmp/sampled_tool_ids.txt) tool IDs pinned in .github/scheduled-tool-ids.txt"
            run_pinned_list_preflight
          elif [ -n "$TOOL_LIST_FILE" ] && [ -s "$TOOL_LIST_FILE" ]; then
            cp "$TOOL_LIST_FILE" /tmp/sampled_tool_ids.txt
            echo "Manual run: testing the $(wc -l < /tmp/sampled_tool_ids.txt) tool IDs from $TOOL_LIST_FILE"
            run_pinned_list_preflight
          elif [ "$RANDOM_TOOL_COUNT" != "0" ]; then
            echo "Fetching the full testable tool list to sample $RANDOM_TOOL_COUNT from..."
            curl -sf -H "x-api-key: $KEY" "${GALAXY_URL}api/tools/tests_summary" \
              | python3 -c "import json, sys; print('\n'.join(json.load(sys.stdin).keys()))" \
              > /tmp/all_tool_ids.txt
            echo "Found $(wc -l < /tmp/all_tool_ids.txt) testable tool IDs"
            # Drop the categorically-excluded tools before sampling.
            # .github/excluded-tool-ids.txt holds the list and the reason for
            # each entry - tools that cannot produce a useful result here no
            # matter what we fix, so sampling them only manufactures a red
            # cell. Entries are version-independent fixed substrings, so they
            # survive regeneration of scheduled-tool-ids.txt. Data managers
            # are one entry in there rather than a special case: they report
            # a generic error with no per-test detail, or no report at all,
            # while their underlying job (a real, often multi-hour index
            # build) keeps running with nothing left to poll it once the
            # client's given up - orphaned until GCP Batch's own 24h
            # max_run_duration eventually kills it (see "Clean up orphaned
            # GCP Batch jobs" below).
            EXCLUDE_FILE=.github/excluded-tool-ids.txt
            if [ -s "$EXCLUDE_FILE" ]; then
              grep -vE '^\s*(#|$)' "$EXCLUDE_FILE" > /tmp/exclude_patterns.txt
              grep -v -F -f /tmp/exclude_patterns.txt /tmp/all_tool_ids.txt \
                > /tmp/all_tool_ids_filtered.txt
              echo "Excluded $(( $(wc -l < /tmp/all_tool_ids.txt) - $(wc -l < /tmp/all_tool_ids_filtered.txt) ))" \
                   "tool IDs via $EXCLUDE_FILE ($(wc -l < /tmp/exclude_patterns.txt) patterns)"
            else
              cp /tmp/all_tool_ids.txt /tmp/all_tool_ids_filtered.txt
              echo "No exclusion file at $EXCLUDE_FILE - sampling from all testable tools"
            fi
            shuf -n "$RANDOM_TOOL_COUNT" /tmp/all_tool_ids_filtered.txt > /tmp/sampled_tool_ids.txt
            echo "Sampled $(wc -l < /tmp/sampled_tool_ids.txt) tool IDs from the filtered pool"
          fi

          if [ -s /tmp/sampled_tool_ids.txt ]; then
            cp /tmp/sampled_tool_ids.txt logs/sampled-tool-ids.txt

            # Each worker gets its own results file and history name (both
            # keyed by line number) instead of sharing one - concurrent
            # processes appending to the same results.json would race, and
            # concurrently creating a history with the same name for the
            # first time is a similar TOCTOU race in galaxy-tool-test's own
            # get-or-create logic. That race is across *different* tools'
            # processes sharing one file/history, which per-tool files
            # already solve - it doesn't apply to a single tool's own
            # --parallel-tests > 1 test cases racing each other within one
            # process. --parallel-tests 1 was leaving that on the table: a
            # handful of tools with many test cases (spades: 18, mitohifi:
            # 11, image_learner/tabular_learner: 5) were running them fully
            # serially in their one worker slot while the other 31 sat idle
            # having long since finished their own (usually 1-2 test case)
            # tools - confirmed live, spades's 18 serialized subtests summed
            # to 6028s against a 6038s total run (run 260829-120233). Set to
            # 4 so a tool's own test cases parallelize too, not just
            # different tools against each other.
            #
            # A `while read` loop with manual job-count capping, not `xargs
            # -n 2`: some real tool IDs contain embedded spaces (e.g.
            # ".../EMBOSS: compseq14/5.0.0.1"), and xargs's default
            # whitespace tokenization doesn't know an (index, tool_id)
            # pair is supposed to stop at a newline - one such tool desyncs
            # every pairing after it. A first attempt (random-tool-count=200,
            # run 32485958305) silently dropped 120 of 200 sampled tools
            # this way - `read` preserves each line, spaces and all.
            mkdir -p results/by-tool
            run_one() {
              local idx="$1" tool_id="$2"
              galaxy-tool-test \
                -u "$GALAXY_URL" -k "$KEY" -a "$KEY" \
                --parallel-tests 4 \
                --force_path_paste \
                "${TEST_DATA_ARGS[@]}" \
                -t "$tool_id" \
                -j "results/by-tool/$idx.json" \
                --history-name "anvil-test-$INSTANCE_NAME-$idx" \
                --no-history-cleanup \
                --verbose || true
            }
            idx=0
            while IFS= read -r tool_id; do
              idx=$((idx + 1))
              run_one "$idx" "$tool_id" &
              while [ "$(jobs -r -p | wc -l)" -ge "$PARALLEL_TESTS" ]; do
                wait -n
              done
            done < /tmp/sampled_tool_ids.txt
            wait

            python3 -c "
          import json, glob
          tests = []
          for path in glob.glob('results/by-tool/*.json'):
              with open(path) as f:
                  data = json.load(f)
              tests.extend(data.get('tests', []))
          counts = {'success': 0, 'error': 0, 'skip': 0, 'failure': 0}
          for t in tests:
              if t.get('has_data'):
                  status = t.get('data', {}).get('status')
                  if status in counts:
                      counts[status] += 1
          report = {
              'version': '0.1',
              'suitename': 'Galaxy Tool Tests',
              'results': {
                  'total': sum(counts.values()),
                  'errors': counts['error'],
                  'failures': counts['failure'],
                  'skips': counts['skip'],
              },
              'tests': sorted(tests, key=lambda el: el['id']),
          }
          with open('results/results.json', 'w') as f:
              json.dump(report, f)
          print(f'Merged {len(tests)} test results from {len(glob.glob(\"results/by-tool/*.json\"))} tool-test files')
          "
          else
            PAGE_ARGS=()
            if [ "$TEST_PAGE_SIZE" != "0" ]; then
              PAGE_ARGS=(--page-size "$TEST_PAGE_SIZE" --page-number "$TEST_PAGE_NUMBER")
            fi
            galaxy-tool-test \
              -u "$GALAXY_URL" -k "$KEY" -a "$KEY" \
              --parallel-tests "$PARALLEL_TESTS" \
              --force_path_paste \
              "${TEST_DATA_ARGS[@]}" \
              "${PAGE_ARGS[@]}" \
              -j results/results.json \
              --history-name "anvil-test-$INSTANCE_NAME" \
              --no-history-cleanup \
              --verbose
          fi

      # galaxy-tool-test snapshots each job's full details (job_metrics
      # included) the instant it sees state=ok and never looks again -
      # but metrics collection is a separate step queued behind the same
      # busy job-handler worker pool, so it routinely lands seconds after
      # that snapshot already fired (confirmed live: 14ms-12s+ lag,
      # usually losing the race). Best-effort, so a hiccup here shouldn't
      # fail the run over metrics completeness.
      - name: Backfill missing GCP Batch job_metrics
        if: ${{ inputs.run-tests || github.event_name == 'schedule' }}
        continue-on-error: true
        run: |
          GALAXY_URL="http://${{ steps.vm-ip.outputs.ip }}/galaxy/"
          KEY="${{ steps.api-key.outputs.key }}"
          export GALAXY_URL KEY
          python3 .github/scripts/anvil_backfill_job_metrics.py results/results.json

      - name: Build HTML/xunit report
        if: ${{ inputs.run-tests || github.event_name == 'schedule' }}
        run: |
          planemo test_reports results/results.json \
            --test_output results/results.html \
            --test_output_xunit results/results.xunit

      # logs/galaxy-web.log has been accumulating continuously since "Start
      # continuous Galaxy web/job pod log capture" above, and at 32-way
      # parallelism routinely runs 55-60MB raw - close enough to GitHub's
      # hard 100MB per-file push limit that one busier-than-usual run (the
      # 2026-08-27 manual dispatch) tipped over it and got the whole push
      # rejected (GH001), silently losing that run's report commit
      # entirely. gzip first: text logs like this compress 5-10x, and
      # nothing downstream reads this file programmatically (only
      # galaxy-web-startup.log, a separate small early snapshot, is parsed
      # by anvil_generate_galaxy_startup_stages.py) so there's no reader to
      # update - it's committed compressed and read with zcat/gunzip when
      # needed. if: always() so a failed deploy or a failed/skipped test
      # run still gets whatever was captured before cleanup deletes the VM.
      - name: Save Galaxy web handler logs under reports/anvil
        if: always()
        continue-on-error: true
        working-directory: /tmp/main-clone
        run: |
          DIR="reports/anvil/deployments/${{ steps.instance.outputs.name }}"
          mkdir -p "$DIR"
          gzip -c "${{ github.workspace }}/logs/galaxy-web.log" > "$DIR/galaxy-web.log.gz"

      # Job orchestration/input-staging errors (the source of most
      # "Galaxy/test harness" incidents on the results-brief page) run in
      # the job handler, not the web handler - the web log alone doesn't
      # have them. Deployment name (`galaxy-job-0`) per
      # galaxy-helm/galaxy/templates/deployment-job.yaml. Like galaxy-web.log
      # above, logs/galaxy-job.log has been accumulating continuously since
      # "Start continuous Galaxy web/job pod log capture" - gzip'd for the
      # same GitHub file-size-limit reason.
      - name: Save Galaxy job handler logs under reports/anvil
        if: always()
        continue-on-error: true
        working-directory: /tmp/main-clone
        run: |
          DIR="reports/anvil/deployments/${{ steps.instance.outputs.name }}"
          mkdir -p "$DIR"
          gzip -c "${{ github.workspace }}/logs/galaxy-job.log" > "$DIR/galaxy-job.log.gz"

      # results.xunit isn't copied here - nothing downstream reads it
      # (confirmed by grep; only planemo ever generates it), and it's
      # still fully available via the "Upload results as a workflow
      # artifact" step below regardless. results.html *is* copied here,
      # transiently: the raster-data step below still needs to read it
      # from this path to produce the single copy that actually gets
      # committed (docs/tool-tests/<run_id>/results.html, the one GitHub
      # Pages serves) - removed again right after, see "Remove redundant
      # results.html copy".
      - name: Save results under reports/anvil
        if: ${{ inputs.run-tests || github.event_name == 'schedule' }}
        working-directory: /tmp/main-clone
        run: |
          DIR="reports/anvil/tool-tests/${{ steps.instance.outputs.name }}"
          mkdir -p "$DIR"
          cp "${{ github.workspace }}/results/results.json" \
             "${{ github.workspace }}/results/results.html" \
             "$DIR/"

      # Reads the job.create_time/update_time/external_id already present
      # in the results.json just saved above - no new capture during the
      # run, and re-derives every historical run's trace too, not just this
      # one (see anvil_generate_parallelism_data.py's docstring).
      - name: Generate job-parallelism trace data
        if: ${{ inputs.run-tests || github.event_name == 'schedule' }}
        working-directory: /tmp/main-clone
        run: python "${{ github.workspace }}/.github/scripts/anvil_generate_parallelism_data.py"

      # Same job.job_metrics source as the parallelism trace above, but
      # per-GCP-Batch-job runtime/resource records for the "Job runtimes"
      # Gantt chart, instead of a concurrency step function.
      - name: Generate GCP Batch job runtime data
        if: ${{ inputs.run-tests || github.event_name == 'schedule' }}
        working-directory: /tmp/main-clone
        run: python "${{ github.workspace }}/.github/scripts/anvil_generate_job_runtime_data.py"

      # Full run history, no window cap - the renderer (docs/raster.html)
      # decides how much to show and how far prev/next/deep-links can
      # reach. Also copies each run's results.html into docs/tool-tests/,
      # which the README step below links to directly.
      - name: Generate tool x run raster data
        if: ${{ inputs.run-tests || github.event_name == 'schedule' }}
        working-directory: /tmp/main-clone
        run: python "${{ github.workspace }}/.github/scripts/anvil_generate_raster_data.py"

      # The step above already copied it to docs/tool-tests/<run_id>/,
      # which is what actually needs committing (GitHub Pages serves from
      # docs/). This copy was only ever a relay for that step to read from -
      # committing both was a byte-identical duplicate every run.
      - name: Remove redundant results.html copy
        if: ${{ inputs.run-tests || github.event_name == 'schedule' }}
        working-directory: /tmp/main-clone
        run: rm -f "reports/anvil/tool-tests/${{ steps.instance.outputs.name }}/results.html"

      # Reads docs/raster-data/{manifest,matrix}.json and per-run
      # detail.json written by the step above - must run after it.
      - name: Generate results-brief incident analysis data
        if: ${{ inputs.run-tests || github.event_name == 'schedule' }}
        working-directory: /tmp/main-clone
        run: python "${{ github.workspace }}/.github/scripts/anvil_generate_analysis_data.py"

      # Reads the analysis.json just written above and asks Gemini to
      # prose-ify it into a short, plain-English verdict for the top of
      # results-brief.html - see anvil_generate_brief_summary.py's own
      # docstring for why this doesn't have the model do any clustering
      # or classification itself. Best-effort: an LLM/API hiccup shouldn't
      # fail the whole run over what's an advisory summary, not source data.
      - name: Generate LLM summary for results-brief page
        if: ${{ inputs.run-tests || github.event_name == 'schedule' }}
        continue-on-error: true
        working-directory: /tmp/main-clone
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python "${{ github.workspace }}/.github/scripts/anvil_generate_brief_summary.py"

      - name: Update reports/anvil/README.md
        if: ${{ inputs.run-tests || github.event_name == 'schedule' }}
        working-directory: /tmp/main-clone
        run: |
          RUN_HTML_URL="https://anvilproject.github.io/galaxy-tests/tool-tests/${{ steps.instance.outputs.name }}/results.html"
          python "${{ github.workspace }}/.github/scripts/anvil_update_readme.py" "${{ steps.instance.outputs.name }}" "$RUN_HTML_URL"

      # Raw per-run artifacts (deployment logs, results.json) are useful
      # for digging into a specific run shortly after it happens, not
      # something anyone browses months later - each run's own workflow
      # artifact upload (below) already covers that need independently of
      # git, kept by GitHub for 90 days by default. Left uncommitted-
      # forever, they're what made this repo's clone/checkout slow (see
      # anvil_prune_old_raw_reports.py's docstring). Deliberately doesn't
      # touch docs/ (raster-data/analysis-data/parallelism-data/job-
      # runtime-data) or deployments.{json,html,svg} - those are the small,
      # derived data that actually power the historical dashboards, kept
      # forever by design. if: always() - this is repo housekeeping,
      # unrelated to whether this particular run tested tools.
      - name: Prune old raw per-run reports
        if: always()
        continue-on-error: true
        working-directory: /tmp/main-clone
        run: python "${{ github.workspace }}/.github/scripts/anvil_prune_old_raw_reports.py"

      # if: always() so deploy-health metrics (from "Record deploy timing"
      # above) still get committed even when tests were skipped or failed -
      # deployments.json/svg/html are already written by that point
      # regardless of inputs.run-tests. All prior report-generation steps
      # above wrote directly into /tmp/main-clone, so this just commits
      # whatever's there.
      - name: Commit and push reports to main
        if: always()
        working-directory: /tmp/main-clone
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add reports/anvil docs/tool-tests docs/raster-data docs/deploy-data docs/analysis-data docs/parallelism-data docs/job-runtime-data 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No report changes to commit"
            exit 0
          fi
          git commit -m "Update anvil reports from run ${{ github.run_id }}"
          # This job runs for hours, so by the time it pushes, main has
          # often moved (other CI report commits, unrelated human commits).
          # A plain push then gets rejected as non-fast-forward - rebase
          # onto the current main and retry rather than losing the run's
          # reports outright.
          for attempt in 1 2 3 4 5; do
            if git push origin main; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) - main moved during this run; rebasing and retrying"
            git fetch origin main
            git rebase origin/main
            sleep 5
          done
          echo "::error::Failed to push reports to main after 5 attempts"
          exit 1

      - name: Upload results as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anvil-test-${{ steps.instance.outputs.name }}
          path: |
            results/
            logs/
          if-no-files-found: ignore

      # Individual GCP Batch jobs run on their own separate VMs, entirely
      # independent of the cluster's own control-plane instance - deleting
      # that instance below does nothing to them. A tool whose test
      # invocation errors in a way galaxy-tool-test doesn't cleanly resolve
      # can leave its Batch job running for real, with nothing left to
      # poll it once this workflow finishes - orphaned until GCP Batch's
      # own 24h max_run_duration eventually kills it (confirmed live:
      # Galaxy Data Manager tools - index/database builders like
      # kraken2_build_database - report a generic error with no per-test
      # detail from galaxy-tool-test, or no report at all, while their
      # underlying job - a real, often multi-hour index build - keeps
      # running). Filtered to jobs created since this run's own start, not
      # by name pattern (job_id_prefix is configurable and has changed
      # before - see anvil_generate_job_runtime_data.py's is_gcp_batch()),
      # and deleted via the Batch API rather than the raw VM so Batch's
      # own job state stays consistent.
      - name: Clean up orphaned GCP Batch jobs
        if: always()
        continue-on-error: true
        run: |
          RUN_START="$(date -u -d "@${{ steps.deploy-start.outputs.epoch }}" +%Y-%m-%dT%H:%M:%SZ)"
          STUCK=$(gcloud batch jobs list --project="$GCP_PROJECT" --location=us-east4 \
            --filter="createTime>=$RUN_START AND (status.state=RUNNING OR status.state=QUEUED OR status.state=SCHEDULED)" \
            --format="value(name)" 2>/dev/null)
          if [ -z "$STUCK" ]; then
            echo "No orphaned GCP Batch jobs from this run."
          else
            echo "$STUCK" | while IFS= read -r job; do
              echo "Deleting orphaned Batch job: $job"
              gcloud batch jobs delete "$job" --quiet || true
            done
          fi

      - name: Delete VM
        if: always()
        run: |
          gcloud compute instances delete "${{ steps.instance.outputs.name }}" \
            --project="$GCP_PROJECT" --zone="$GCP_ZONE" --quiet || echo "VM already gone"
