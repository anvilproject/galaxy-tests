# Curated signature-classification rules for anvil_generate_analysis_data.py
# (v2_brief.md "Suggested source taxonomy" / "A small curated rules file").
#
# Checked in order against each incident's normalized signature text;
# first match wins. Unmatched signatures fall back to
# category: Unknown, confidence: Unclassified - that's the expected,
# honest default for a signature nobody's looked at yet, not a bug.
#
# Fields:
#   pattern: a Python re.search() regex against the normalized signature.
#   category: one of Infrastructure, Galaxy/test harness, Tool/runtime,
#     Test expectation/data.
#   confidence: High, Probable, or Unclassified.
#   title: optional short human title for the incident. Falls back to a
#     truncated signature if omitted.

- pattern: 'TypeError: stat: path should be string'
  category: Galaxy/test harness
  confidence: High
  title: Input staging TypeError (test_data_path 404 bug)

# The server could not resolve a test input file. Matched against the
# normalized signature, so the filename is already collapsed to <file> and one
# deployment-wide test-data gap groups as one incident. Distinct from a stale
# expectation: nothing was compared, the input never staged. On this
# deployment it is dominated by Galaxy's built-in tools, whose test-data lives
# in Galaxy's own tree rather than the CVMFS toolset.
- pattern: 'Test input file \(<file>\) cannot be found'
  category: Infrastructure
  confidence: High
  title: Test input data unavailable on the server

- pattern: 'Job in error state\.\. tool_id: __\w+__'
  category: Galaxy/test harness
  confidence: Probable
  title: Internal Galaxy utility job failed

# Must precede the generic expectation-mismatch rule below: an empty output
# is an execution-layer fault (the tool produced nothing), not a stale
# expectation, and on this deployment it tracks the GCP Batch metadata
# write-back failure rather than anything about the test itself.
- pattern: '^Output produced no content'
  category: Infrastructure
  confidence: High
  title: Output produced no content (empty/lost dataset)

- pattern: 'different than expected|Expected text|Expected path|failed to find identifier|expected to have \d+ elements|Test output file .* is missing'
  category: Test expectation/data
  confidence: Probable

- pattern: 'Job in error state'
  category: Tool/runtime
  confidence: Probable

- pattern: "Parameter '.*': specify a dataset"
  category: Test expectation/data
  confidence: Probable
  title: Input dataset format/build mismatch
