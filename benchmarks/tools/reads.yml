# Read-level QC, trimming and alignment on the staged 2 GB inputs. Everything
# downstream (bam.yml, variants.yml, chipseq.yml, rnaseq.yml, text.yml) hangs
# off the BAMs produced here. Input names are the contents of the histories
# that benchmarks/bootstrap.yml imports. Validate with
#
#   .github/scripts/anvil_tool_matrix.py validate benchmarks/tools/*.yml
#
# The staged collections are list:paired with one pair. {batch: ...} on a
# single-dataset input maps over every read file (two jobs per replica); on a
# paired-collection input with map_over: paired it maps over the list,
# handing the tool one pair (one job) the way a workflow does. Passing the list itself fails while
# Galaxy builds the command line. The driver unwraps the resulting
# one-element output collections for downstream entries.
history: Variant 2GB inputs

tools:
  # ---- per-read-file QC (two jobs each) ------------------------------------
  - id: fastqc
    tool: fastqc
    inputs:
      input_file: {batch: {collection: Subsample of reads from SRR24043307}}

  - id: falco
    tool: falco
    inputs:
      input_file: {batch: {collection: Subsample of reads from SRR24043307}}

  - id: fastq_groomer
    tool: fastq_groomer
    inputs:
      input_file: {batch: {collection: Subsample of reads from SRR24043307}}
      input_type: sanger
      options_type|output_type: sanger.gz

  - id: fastq_to_fasta
    tool: fastq_to_fasta_python
    inputs:
      input_file: {batch: {collection: Subsample of reads from SRR24043307}}

  - id: seqtk_sample
    tool: seqtk_sample
    inputs:
      in_file: {batch: {collection: Subsample of reads from SRR24043307}}
      subsample_size: 0.1
      s: 4

  - id: seqtk_comp
    tool: seqtk_comp
    inputs:
      in_file: {batch: {collection: Subsample of reads from SRR24043307}}

  # ---- paired trimmers ------------------------------------------------------
  - id: fastp
    tool: fastp
    inputs:
      single_paired|single_paired_selector: paired_collection
      single_paired|paired_input: {batch: {collection: Subsample of reads from SRR24043307}, map_over: paired}

  - id: trimmomatic
    tool: trimmomatic
    inputs:
      readtype|single_or_paired: collection
      readtype|fastq_pair: {batch: {collection: Subsample of reads from SRR24043307}, map_over: paired}
      illuminaclip|do_illuminaclip: "no"
      operations_0|operation|name: SLIDINGWINDOW
      operations_0|operation|window_size: 4
      operations_0|operation|required_quality: 20

  - id: trim_galore
    tool: trim_galore
    inputs:
      singlePaired|sPaired: paired_collection
      singlePaired|input_mate_pairs: {batch: {collection: Subsample of reads from SRR24043307}, map_over: paired}
      params|settingsType: default

  - id: cutadapt
    tool: cutadapt
    inputs:
      library|type: paired_collection
      library|input_1: {batch: {collection: Subsample of reads from SRR24043307}, map_over: paired}
      library|r1|adapters_0|adapter_source|adapter_source_list: user
      library|r1|adapters_0|adapter_source|adapter: AGATCGGAAGAGCACACGTCTGAACTCCAGTCAC
      output_selector: [report, json_stats]

  # ---- aligners against the CVMFS hg38 indexes ------------------------------
  - id: bwa
    tool: bwa_mem
    inputs:
      reference_source|reference_source_selector: cached
      reference_source|ref_file: hg38
      fastq_input|fastq_input_selector: paired_collection
      fastq_input|fastq_input1: {batch: {collection: Subsample of reads from SRR24043307}, map_over: paired}
      output_sort: coordinate

  # bwa_mem2 is not here: the CVMFS data has no human bwa-mem2 index (only
  # Arabidopsis_thaliana_TAIR10 and mm39), so it fails at submission.

  - id: minimap2
    tool: minimap2
    inputs:
      reference_source|reference_source_selector: cached
      reference_source|ref_file: hg38
      fastq_input|fastq_input_selector: paired_collection
      fastq_input|fastq_input1: {batch: {collection: Subsample of reads from SRR24043307}, map_over: paired}
      fastq_input|analysis_type_selector: sr

  - id: bowtie2
    tool: bowtie2
    history: ChIPseq 2GB inputs
    inputs:
      library|type: paired_collection
      library|input_1: {batch: {collection: chipseq-2g}, map_over: paired}
      reference_genome|source: indexed
      reference_genome|index: hg38
      save_mapping_stats: true

  - id: hisat2
    tool: hisat2
    history: RNAseq 2GB inputs
    inputs:
      reference_genome|source: indexed
      reference_genome|index: hg38
      library|type: paired_collection
      library|input_1: {batch: {collection: SRR24043307}, map_over: paired}
      library|rna_strandness: FR
      sum|new_summary: true
      sum|summary_file: true
