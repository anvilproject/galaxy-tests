# Peak calling and interval tools on the bowtie2 ChIP-seq alignment from
# reads.yml. Gene annotations come from the GTF in the RNA-seq history.
history: RNAseq 2GB inputs

tools:
  - id: macs2
    tool: macs2_callpeak
    inputs:
      treatment|t_multi_select: "No"
      treatment|input_treatment_file: [{from: bowtie2, output: output}]
      control|c_select: "No"
      format: BAMPE
      effective_genome_size_options|effective_genome_size_options_selector: "2700000000"
      nomodel_type|nomodel_type_selector: nomodel
      nomodel_type|extsize: 200
      cutoff_options|cutoff_options_selector: qvalue
      cutoff_options|qvalue: 0.05
      outputs: [peaks_tabular, summits, bdg]

  - id: bdgdiff
    tool: macs2_bdgdiff
    inputs:
      t1: {from: macs2, output: output_treat_pileup}
      c1: {from: macs2, output: output_control_lambda}
      t2: {from: macs2, output: output_treat_pileup}
      c2: {from: macs2, output: output_control_lambda}

  - id: bamcov_chip
    tool: deeptools_bam_coverage
    inputs:
      bamInput: {from: bowtie2, output: output}
      binSize: 50
      scaling|type: 1x
      scaling|effectiveGenomeSize|effectiveGenomeSize_opt: "2701495761"
      outFileFormat: bigwig

  - id: bigwig_compare
    tool: deeptools_bigwig_compare
    inputs:
      bigwigFile1: {from: bamcov_chip, output: outFileName}
      bigwigFile2: {from: bamcov, output: outFileName}
      comparison|comparison_select: log2
      outFileFormat: bigwig

  - id: compute_matrix
    tool: deeptools_compute_matrix
    inputs:
      regionsFiles_0|regionsFile: {dataset: ucsc.hg38.knownGene.gtf}
      multibigwig_conditional|orderMatters: "No"
      multibigwig_conditional|bigwigfiles: [{from: bamcov_chip, output: outFileName}]
      mode|mode_select: reference-point
      mode|referencePoint: TSS
      mode|beforeRegionStartLength: 2000
      mode|afterRegionStartLength: 2000

  - id: plot_heatmap
    tool: deeptools_plot_heatmap
    inputs:
      matrixFile: {from: compute_matrix, output: outFileName}

  - id: plot_enrichment
    tool: deeptools_plot_enrichment
    inputs:
      multibam_conditional|orderMatters: "No"
      multibam_conditional|bamfiles: [{from: bowtie2, output: output}]
      BED: [{from: macs2, output: output_narrowpeaks}]

  # ---- bedtools on the peak calls ------------------------------------------
  - id: intersect
    tool: bedtools_intersectbed
    inputs:
      inputA: {from: macs2, output: output_narrowpeaks}
      reduce_or_iterate|reduce_or_iterate_selector: iterate
      reduce_or_iterate|inputB: [{dataset: ucsc.hg38.knownGene.gtf}]
      overlap_mode: ["-wa"]

  - id: window
    tool: bedtools_windowbed
    inputs:
      inputA: {from: macs2, output: output_narrowpeaks}
      inputB: {dataset: ucsc.hg38.knownGene.gtf}
      addition|addition_select: window
      addition|w: 5000

  # bedtools complement and fisher insist that the intervals and the genome
  # file share one sort order, and MACS2 peaks are not in the order of the
  # built-in hg38 genome file. Sort the peaks and summits lexicographically
  # and build a genome file in the same order from the alignment's idxstats.
  - id: idxstats_chip
    tool: samtools_idxstats
    inputs:
      input: {from: bowtie2, output: output}

  - id: genome_file
    tool: tp_cut_tool
    inputs:
      input: {from: idxstats_chip, output: output}
      cut_type_options|cut_element: "-f"
      cut_type_options|colnames_option|header: N
      cut_type_options|colnames_option|list: ["1", "2"]

  # idxstats ends with the unmapped-reads row "*  0  0  N"; bedtools rejects a
  # genome file with a zero-length chromosome, so drop it before sorting.
  - id: genome_nostar
    tool: tp_grep_tool
    inputs:
      infile: {from: genome_file, output: output}
      invert: "-v"
      regex_type: "-P"
      url_paste: "^\\*\\t"

  - id: genome_sorted
    tool: tp_sort_header_tool
    inputs:
      infile: {from: genome_nostar, output: output}
      header: 0
      sortkeys_0|column: "1"
      sortkeys_0|style: ""

  - id: peaks_sorted
    tool: tp_sort_header_tool
    inputs:
      infile: {from: macs2, output: output_narrowpeaks}
      header: 0
      sortkeys_0|column: "1"
      sortkeys_0|style: ""
      sortkeys_1|column: "2"
      sortkeys_1|style: n

  - id: summits_sorted
    tool: tp_sort_header_tool
    inputs:
      infile: {from: macs2, output: output_summits}
      header: 0
      sortkeys_0|column: "1"
      sortkeys_0|style: ""
      sortkeys_1|column: "2"
      sortkeys_1|style: n

  - id: complement
    tool: bedtools_complementbed
    inputs:
      input: {from: peaks_sorted, output: outfile}
      genome_file_opts|genome_file_opts_selector: hist
      genome_file_opts|genome: {from: genome_sorted, output: outfile}

  - id: getfasta
    tool: bedtools_getfastabed
    inputs:
      input: {from: macs2, output: output_summits}
      fasta_source|fasta_source_selector: preloaded
      fasta_source|fasta_id: hg38

  - id: shuffle
    tool: bedtools_shufflebed
    inputs:
      inputA: {from: macs2, output: output_narrowpeaks}
      genome_file_opts|genome_file_opts_selector: loc
      genome_file_opts|genome: hg38
      chrom: true
      seed: 42

  - id: fisher
    tool: bedtools_fisher
    inputs:
      inputA: {from: peaks_sorted, output: outfile}
      inputB: {from: summits_sorted, output: outfile}
      genome_file_opts|genome_file_opts_selector: hist
      genome_file_opts|genome: {from: genome_sorted, output: outfile}

  - id: bedtoigv
    tool: bedtools_bedtoigv
    inputs:
      input: {from: macs2, output: output_summits}

  - id: extract_dna
    tool: Extract genomic DNA 1
    inputs:
      input: {from: macs2, output: output_summits}
      interpret_features: "no"
      seq_source|index_source: cached
      seq_source|ref_file: hg38
      out_format: fasta
